name: Build APK (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js (Cordova 需要)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. 设置 Java 17 (Android 构建必须)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. 安装 Cordova 和 Android 平台
      - name: Install Cordova & Android Platform
        run: |
          npm install -g cordova@12.0.0
          cordova create temp-app com.example.travel "旅游查询助手"
          cd temp-app
          rm -rf www/*
          cp -r ../www/* www/  # 假设你的网页文件在仓库根目录的 www 文件夹下
          cordova platform add android@12.0.1

      # 5. 构建 APK
      - name: Build APK
        run: |
          cd temp-app
          cordova build android --release -- --gradleArg=--no-daemon

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-app-apk
          path: temp-app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
