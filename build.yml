name: Build APK with Pake

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Pake
        run: npm install -g pake-cli

      - name: Build APK
        run: |
          pake index.html \
            --name "旅游查询助手" \
            --platform android \
            --output ./dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-app-apk
          path: ./dist/*.apk
