name: Build Travel APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 使用开源工具将网页套壳打包成 APK
      - name: Build APK using PikaPlus
        uses: tiann/PikaPlus@main
        with:
          # 这里指定你的网页文件作为入口
          entry_file: index.html 
          app_name: "旅游查询助手"
          package_name: "com.travel.query"
          version_code: 1
          version_name: "1.0.0"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: travel-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
