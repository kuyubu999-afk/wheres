<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全国旅游美食交通查询</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        p { color: #666; line-height: 1.6; }
        input { padding: 10px; width: 200px; margin-right: 5px; border-radius: 5px; border: 1px solid #ddd; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 旅游查询助手</h1>
        <p>输入城市名，获取景点、美食与交通建议</p>
        <input type="text" id="cityInput" placeholder="例如：杭州">
        <button onclick="alert('功能开发中，敬请期待！')">查询</button>
    </div>
</body>
</html>
